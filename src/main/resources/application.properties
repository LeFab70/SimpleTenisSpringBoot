spring.application.name=tennis
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.datasource.url=jdbc:postgresql://localhost:5433/tennisDb
spring.datasource.username=postgres
spring.datasource.password=postgres
logging.level.org.leFab.players.controllers.PlayerController=info
server.port=8081

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

spring.jpa-open-in-view=false
spring.jpa.hibernate.ddl-auto=update
  #none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.tomcat.connection-timeout=2s
server.tomcat.threads.max=500

spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=USER
debug=true

jwt.auth.client-id=app-ecom
jwt.auth.principal-attribute=preferred_username
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ecom-web-app
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/ecom-web-app/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwk.set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

